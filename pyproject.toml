[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsa-cli"
version = "0.1.0"
description = "CLI para cifrar y descifrar RSA con JKS"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43.0.0",
  "pyjks>=20.0.0",
  "typer>=0.12.0",
  "PyYAML>=6.0.0"
]

[project.scripts]
rsacli = "rsa_cli.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
